group 'dev.isar.isar_flutter_libs'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'  // Atualizado para SDK 35
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.isar.isar_flutter_libs'  // Adicionado para Android SDK 35
    compileSdkVersion 35  // Atualizado para SDK 35

    defaultConfig {
        minSdkVersion 21  // Atualizado minSdk
        targetSdkVersion 35  // Adicionado targetSdk
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17  // Java 17 para SDK 35
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.startup:startup-runtime:1.1.1"
}